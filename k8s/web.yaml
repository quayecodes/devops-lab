# ============================================================
# Nginx Frontend Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: devops-lab
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: devops-lab-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"

---
# ============================================================
# Nginx NodePort Service (accessible outside cluster)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: devops-lab
    tier: frontend
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
