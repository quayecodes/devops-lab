version: "3.9"

services:

  # ---- PostgreSQL Database ----
  db:
    image: postgres:15-alpine
    container_name: devops_lab_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops_secret
      POSTGRES_DB: devops_lab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops_lab"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devops_net

  # ---- FastAPI Backend ----
  api:
    build:
      context: ./api
      dockerfile: ../Dockerfile.api
    container_name: devops_lab_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://devops:devops_secret@db:5432/devops_lab
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - devops_net

  # ---- Nginx Frontend ----
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: devops_lab_web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - devops_net

volumes:
  postgres_data:
    driver: local

networks:
  devops_net:
    driver: bridge
