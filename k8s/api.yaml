# ============================================================
# API ConfigMap (environment variables)
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  labels:
    app: devops-lab
data:
  DATABASE_URL: "postgresql://devops:devops_secret@postgres:5432/devops_lab"

---
# ============================================================
# FastAPI Backend Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: devops-lab
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: devops-lab-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-config
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
# ============================================================
# FastAPI ClusterIP Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: devops-lab
    tier: backend
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
